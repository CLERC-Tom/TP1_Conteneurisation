server {
    listen 80;
    server_name _;
    server_tokens off;
    # Redirections relatives : garde le port publié par Docker (8080)
    absolute_redirect off;

    location = / {
        return 302 /index.php;
    }

    # Liste blanche : seuls ces scripts PHP sont exécutables
    location ~ ^/(index|hello|logout)\.php$ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    }

    location / {
        return 404;
    }
}
