name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env n'est pas versionné : on part des valeurs d'exemple pour la CI
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - if: always()
        run: docker compose down
