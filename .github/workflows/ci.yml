name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d
      - run: curl -sf --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080 | grep "Hello World"
      - if: always()
        run: docker compose down
