apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-hello-world
  namespace: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      # Compte de service dédié, sans accès à l'API Kubernetes
      serviceAccountName: app-sa
      automountServiceAccountToken: false
      securityContext:
        # Le pod ne tourne jamais en root, avec un uid élevé
        runAsNonRoot: true
        runAsUser: 10101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          imagePullPolicy: Always
          securityContext:
            # Pas d'élévation de privilèges, aucune capability, disque en lecture seule
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # nginx a besoin d'écrire dans /tmp, on lui donne un dossier temporaire
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Kubernetes vérifie que nginx répond sur le port 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
