apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-hello-world
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:alpine
